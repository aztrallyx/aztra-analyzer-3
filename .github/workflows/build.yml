name: Build APK
on:
  workflow_dispatch:

# Si lanzas dos builds seguidos, cancela el anterior.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cache de Gradle (dependencias, wrapper, build cache). Es lo que mas
      # tiempo ahorra a partir de la segunda compilacion.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear proyecto Android
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create . --platforms=android --project-name aztra_analyzer --org com.aztrallyx
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Parchar Android (nombre, permisos, servicio en segundo plano)
        run: python3 tools/patch_android.py .

      - name: Ajustes de Gradle (compileSdk 36 en plugins, paralelo y cache)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'EOF2'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library')) {
                p.android.compileSdk = 36
              }
            }
          }
          EOF2
          cat >> ~/.gradle/gradle.properties <<'EOF2'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
          EOF2

      - name: Firma estable (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore

      - name: Compilar
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --no-shrink --target-platform android-arm64

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aztra-${{ github.run_number }}
          name: Aztra Analyzer ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
